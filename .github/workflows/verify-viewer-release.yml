name: Verify Released Viewer IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download existing build17 without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download build-17 --repo "$GITHUB_REPOSITORY" \
            --pattern V-Lover-Viewer-unsigned.ipa --dir "$RUNNER_TEMP/viewer-check"
      - name: Verify actual IPA subtitles and native inputs
        run: |
          set -euo pipefail
          python3 scripts/verify_viewer_ipa.py \
            --ipa "$RUNNER_TEMP/viewer-check/V-Lover-Viewer-unsigned.ipa" \
            --sha256 ba84b7abb1ffe30bcdb3b28f519dd54caf2cafbd81ceb2cb7b4f5d3e77f20a6a \
            --output "$RUNNER_TEMP/viewer-check/result.json"
          {
            echo '### Actual build17 package inspection'
            echo '```json'
            cat "$RUNNER_TEMP/viewer-check/result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
